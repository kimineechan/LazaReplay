name: Feature request
description: Suggest an improvement to LazaReplay.
title: '[Feature]: '
labels: [enhancement]
body:
  - type: textarea
    id: workflow
    attributes:
      label: What are you trying to do?
      description: Describe what you were trying to record or save, and what got in the way.
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: Suggested behaviour
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives or examples
